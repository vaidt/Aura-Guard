name: Python Deterministic CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest flake8

      - name: Lint deterministic verifier
        run: python -m flake8 py_verifier --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run deterministic verifier tests
        run: python -m pytest -q py_verifier/tests
